plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvlauncher.clean'
    compileSdk 34

    defaultConfig {
        applicationId "com.tvlauncher.clean"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
